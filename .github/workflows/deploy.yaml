name: deploy

# Pre-release on dev -> Desenvolvimento | release on prod -> Produção (also by hand: run on dev or prod).
# In production, the group modules are checked and deployed after the app shell.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: ./.github/workflows/cd.yaml
    secrets: inherit

  # Production only: check and deploy every group's remote (submodules at the repo root)
  remotes:
    needs: shell
    if: needs.shell.outputs.target == 'prod'
    uses: ./.github/workflows/gm_deploy.yaml
    secrets: inherit
