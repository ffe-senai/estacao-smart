name: group-modules_ci

# Checks every group module (git submodule in a root folder) in a single job.
# Contract per module: package.json and a lockfile (package-lock.json or pnpm-lock.yaml) at the root,
# the scripts check and build, and a build that generates dist/remoteEntry.js.
# Called by ci.yaml on every PR and by gm_deploy.yaml before the production deploy of the modules.
on:
  workflow_call:
    outputs:
      report:
        description: One line per checked module (compatible or not, and why)
        value: ${{ jobs.check.outputs.report }}
      found:
        description: JSON list of the module folders that exist
        value: ${{ jobs.check.outputs.found }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.validate.outputs.report }}
      found: ${{ steps.validate.outputs.found }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.REMOTES_TOKEN || github.token }}   # REMOTES_TOKEN only needed if group repos are private

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate modules
        id: validate
        run: |
          # Module folder -> group shown in the report (production subdomain)
          declare -A GROUP=([ihm-siemens]=g2 [cobot-ur]=g3 [rastreabilidade]=g4 [expedicao]=g5 [poc]=poc)

          # Prints the reason a module is incompatible (nothing when it passes); command output goes to the log
          problem_of() (
            cd "$1" || { echo "pasta não encontrada"; return; }
            if   [ -f pnpm-lock.yaml ];    then pm=pnpm install="pnpm install --frozen-lockfile"
            elif [ -f package-lock.json ]; then pm=npm  install="npm ci"
            fi

            if   [ ! -f package.json ];                   then echo "falta o \`package.json\` na raiz"
            elif [ -z "$pm" ];                            then echo "falta o lockfile (\`package-lock.json\` ou \`pnpm-lock.yaml\`)"
            elif ! jq -e .scripts.check package.json >/dev/null; then echo "falta o script \`check\`"
            elif ! jq -e .scripts.build package.json >/dev/null; then echo "falta o script \`build\`"
            elif [ "$pm" = pnpm ] && ! { command -v pnpm || npm i -g pnpm; } >&2; then echo "não foi possível instalar o pnpm"
            elif ! $install >&2;                          then echo "\`$install\` falhou"
            elif ! $pm run check >&2;                     then echo "\`$pm run check\` falhou"
            elif ! $pm run build >&2;                     then echo "\`$pm run build\` falhou"
            elif [ ! -f dist/remoteEntry.js ];            then echo "o build não gerou \`dist/remoteEntry.js\`"
            fi
          )

          modules=$(git config -f .gitmodules --get-regexp '\.path$' 2>/dev/null | awk '{print $2}' || true)
          report="" failed=""
          for module in $modules; do
            group=${GROUP[$module]:-$module}
            echo "::group::Módulo ${group^^} ($module)"
            problem=$(problem_of "$module")
            echo "::endgroup::"

            if [ -n "$problem" ]; then
              report+="❌ Módulo ${group^^} \`$module\` incompatível: $problem"$'\n'
              failed=true
            else
              report+="✅ Módulo ${group^^} \`$module\` compatível"$'\n'
            fi
          done

          printf '%s' "${report:-Nenhum módulo encontrado}"$'\n'
          {
            echo "found=$(printf '%s\n' $modules | jq -Rsc 'split("\n") | map(select(length > 0))')"
            echo "report<<EOF"
            printf '%s' "$report"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          [ -z "$failed" ]
