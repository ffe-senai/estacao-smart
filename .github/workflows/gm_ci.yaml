name: group-modules_ci

# Checks each group module (git submodule in a root folder): one job per existing module,
# absent modules don't show up. Each job uploads a "module-<folder>" artifact with its report line.
# Contract per module: package.json and a lockfile (package-lock.json or pnpm-lock.yaml) at the root,
# the scripts check and build, and a build that generates dist/remoteEntry.js.
# Called by ci.yaml on every PR and by gm_deploy.yaml before the production deploy of the modules.
on:
  workflow_call:
    outputs:
      found:
        description: JSON list of the module folders that exist
        value: ${{ jobs.list.outputs.found }}

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.list.outputs.found }}
    steps:
      - uses: actions/checkout@v7   # without submodules: only reads .gitmodules

      - name: List modules
        id: list
        run: |
          paths=$(git config -f .gitmodules --get-regexp '\.path$' 2>/dev/null | awk '{print $2}' || true)
          echo "found=$(printf '%s\n' $paths | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          echo "Modules: ${paths:-none}"

  check:
    needs: list
    if: needs.list.outputs.found != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # one module failing doesn't cancel the others
      matrix:
        module: ${{ fromJSON(needs.list.outputs.found) }}
    name: check (${{ matrix.module }})
    defaults:
      run:
        shell: bash
    env:
      MODULE: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.REMOTES_TOKEN || github.token }}   # REMOTES_TOKEN only needed if group repos are private

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate module
        working-directory: ${{ matrix.module }}
        run: |
          # Module folder -> group shown in the report (production subdomain)
          declare -A GROUP=([ihm-siemens]=g2 [cobot-ur]=g3 [rastreabilidade]=g4 [expedicao]=g5 [poc]=poc)
          group=${GROUP[$MODULE]:-$MODULE}

          # Package manager from the lockfile the group committed
          if   [ -f pnpm-lock.yaml ];    then pm=pnpm install="pnpm install --frozen-lockfile"
          elif [ -f package-lock.json ]; then pm=npm  install="npm ci"
          fi

          problem=""
          if   [ ! -f package.json ];                   then problem="falta o \`package.json\` na raiz"
          elif [ -z "$pm" ];                            then problem="falta o lockfile (\`package-lock.json\` ou \`pnpm-lock.yaml\`)"
          elif ! jq -e .scripts.check package.json >/dev/null; then problem="falta o script \`check\`"
          elif ! jq -e .scripts.build package.json >/dev/null; then problem="falta o script \`build\`"
          elif [ "$pm" = pnpm ] && ! npm i -g pnpm;     then problem="não foi possível instalar o pnpm"
          elif ! $install;                              then problem="\`$install\` falhou"
          elif ! $pm run check;                         then problem="\`$pm run check\` falhou"
          elif ! $pm run build;                         then problem="\`$pm run build\` falhou"
          elif [ ! -f dist/remoteEntry.js ];            then problem="o build não gerou \`dist/remoteEntry.js\`"
          fi

          if [ -n "$problem" ]; then
            echo "❌ Módulo ${group^^} \`$MODULE\` incompatível: $problem" > "$RUNNER_TEMP/result.md"
            exit 1
          fi
          echo "✅ Módulo ${group^^} \`$MODULE\` compatível" > "$RUNNER_TEMP/result.md"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: module-${{ matrix.module }}
          path: ${{ runner.temp }}/result.md
          if-no-files-found: ignore
