name: group-modules_ci

# Checks each group module (git submodule in a root folder); a module without a submodule is skipped.
# An existing module must pass every check (see gm_module.yaml).
# Called by ci.yaml on every PR and by gm_deploy.yaml before the production deploy of the modules.
on:
  workflow_call:
    outputs:
      report:
        description: One line per checked module (compatible or not, and why)
        value: ${{ jobs.result.outputs.report }}
      found:
        description: JSON list of the module folders that exist
        value: ${{ jobs.modules.outputs.found }}

permissions:
  contents: read

jobs:
  # Submodules registered in .gitmodules; each module job below runs only if its folder is one of them
  modules:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.list.outputs.found }}
    steps:
      - uses: actions/checkout@v7   # without submodules: only reads .gitmodules

      - name: List modules
        id: list
        run: |
          paths=$(git config -f .gitmodules --get-regexp '\.path$' 2>/dev/null | awk '{print $2}' || true)
          echo "found=$(printf '%s\n' $paths | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          echo "Modules: ${paths:-none}"

  # One job per module (folder -> production subdomain)
  check-ihm-siemens:
    name: check (ihm-siemens)
    needs: modules
    if: contains(fromJSON(needs.modules.outputs.found), 'ihm-siemens')
    uses: ./.github/workflows/gm_module.yaml
    with: { folder: ihm-siemens, domain: g2 }
    secrets: inherit

  check-cobot-ur:
    name: check (cobot-ur)
    needs: modules
    if: contains(fromJSON(needs.modules.outputs.found), 'cobot-ur')
    uses: ./.github/workflows/gm_module.yaml
    with: { folder: cobot-ur, domain: g3 }
    secrets: inherit

  check-rastreabilidade:
    name: check (rastreabilidade)
    needs: modules
    if: contains(fromJSON(needs.modules.outputs.found), 'rastreabilidade')
    uses: ./.github/workflows/gm_module.yaml
    with: { folder: rastreabilidade, domain: g4 }
    secrets: inherit

  check-expedicao:
    name: check (expedicao)
    needs: modules
    if: contains(fromJSON(needs.modules.outputs.found), 'expedicao')
    uses: ./.github/workflows/gm_module.yaml
    with: { folder: expedicao, domain: g5 }
    secrets: inherit

  check-poc:
    name: check (poc)
    needs: modules
    if: contains(fromJSON(needs.modules.outputs.found), 'poc')
    uses: ./.github/workflows/gm_module.yaml
    with: { folder: poc, domain: poc }
    secrets: inherit

  # Joins the result of every module into one report (and fails if any module failed)
  result:
    needs: [check-ihm-siemens, check-cobot-ur, check-rastreabilidade, check-expedicao, check-poc]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.collect.outputs.report }}
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true   # no artifacts when every module was skipped
        with:
          pattern: module-*
          path: results

      - name: Collect results
        id: collect
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') }}
        run: |
          {
            echo "report<<EOF"
            cat results/*/result.md 2>/dev/null || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          [ "$FAILED" != true ]

