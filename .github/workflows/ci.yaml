name: ci

on:
  pull_request:
    branches: [dev, prod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true    # a new push cancels the previous run

jobs:
  # Every PR: comment right away with a link to this run (replaced by `report` when it finishes)
  started:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Comment run link on the PR
        run: |
          body="⏳ Verificações em andamento: lint, typecheck, build e módulos"
          if [ "$GITHUB_BASE_REF" = dev ]; then body+=", seguidas do deploy no ambiente de **Teste**"; fi
          body+=$'\n\n'"Commit \`${SHA:0:7}\` · [Acompanhar execução]($RUN_URL)"
          # Replace the previous comment so the latest one is always at the end of the PR
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --delete-last --yes || true   # none on the first run
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"

  # Every PR: lint, typecheck and build
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-shell
    env:
      G2_ENTRY: ${{ vars.G2_ENTRY }}
      G3_ENTRY: ${{ vars.G3_ENTRY }}
      G4_ENTRY: ${{ vars.G4_ENTRY }}
      G5_ENTRY: ${{ vars.G5_ENTRY }}
      POC_ENTRY: ${{ vars.POC_ENTRY }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app-shell/package.json   # version from "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app-shell/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        env:
          G2_ENTRY: ${{ vars.G2_ENTRY }}
          G3_ENTRY: ${{ vars.G3_ENTRY }}
          G4_ENTRY: ${{ vars.G4_ENTRY }}
          G5_ENTRY: ${{ vars.G5_ENTRY }}
          POC_ENTRY: ${{ vars.POC_ENTRY }}
        run: pnpm run build

  # Every PR: check each group module whose folder exists (required to merge)
  modules:
    uses: ./.github/workflows/gm_ci.yaml
    secrets: inherit

  # PR into dev: deploy a Teste preview once checks pass
  teste:
    needs: checks
    if: github.base_ref == 'dev'
    uses: ./.github/workflows/cd.yaml
    secrets: inherit

  # Every PR: one comment with the result of each check, updated on every push
  report:
    needs: [started, checks, modules, teste]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      CHECKS: ${{ needs.checks.result }}
      TESTE: ${{ needs.teste.result }}
      URL: ${{ needs.teste.outputs.url }}
      MODULES: ${{ needs.modules.outputs.report }}
      SHA: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Comment results on the PR
        run: |
          body=""
          line() { body+="- $1"$'\n'; }

          case "$CHECKS" in
            success) line "✅ Lint, typecheck e build" ;;
            failure) line "❌ **Checagem de compilação e sintaxe inválida** (lint, typecheck ou build)" ;;
          esac

          while IFS= read -r module; do
            if [ -n "$module" ]; then line "$module"; fi
          done <<< "$MODULES"

          case "$TESTE" in
            success) line "🚀 Deploy no ambiente de **Teste** sucedido: $URL" ;;
            failure) line "❌ **Erro ao implantar no ambiente de Teste**" ;;
            skipped) if [ "$GITHUB_BASE_REF" = dev ]; then line "⏭️ Deploy no ambiente de **Teste** não executado: corrija a checagem"; fi ;;
          esac

          body+=$'\n'"Commit \`${SHA:0:7}\` · [Ver execução]($RUN_URL)"
          # Replace the previous comment so the latest one is always at the end of the PR
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --delete-last --yes || true   # none on the first run
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
