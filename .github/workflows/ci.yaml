name: ci

on:
  pull_request:
    branches: [dev, prod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true    # a new push cancels the previous run

jobs:
  # Every PR: lint, typecheck and build
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-shell
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app-shell/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # PR into prod: must come from dev, and dev's commit must have a beta pre-release
  from-dev:
    if: github.base_ref == 'prod'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Only dev can merge into prod
        if: github.head_ref != 'dev'
        run: |
          echo "PRs into prod must come from dev, not '$GITHUB_HEAD_REF'"
          exit 1

      - name: Head must have a beta pre-release
        run: |
          betas=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate \
            --jq '.[] | select(.commit.sha == env.HEAD_SHA) | .name | select(contains("-beta."))')

          if [ -z "$betas" ]; then
            echo "Publish a pre-release (x.y.z-beta.N) on dev's latest commit, then re-run this job"
            exit 1
          fi
          echo "Pre-release found: $betas"

  # PR into dev: deploy a Teste preview once checks pass
  teste:
    needs: checks
    if: github.base_ref == 'dev'
    uses: ./.github/workflows/deploy.yaml
    secrets: inherit

  # Every PR: one comment with the result of each check, updated on every push
  report:
    needs: [checks, from-dev, teste]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      CHECKS: ${{ needs.checks.result }}
      FROM_DEV: ${{ needs.from-dev.result }}
      TESTE: ${{ needs.teste.result }}
      URL: ${{ needs.teste.outputs.url }}
      SHA: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Comment results on the PR
        run: |
          body=""
          line() { body+="- $1"$'\n'; }

          case "$CHECKS" in
            success) line "✅ Lint, typecheck e build" ;;
            failure) line "❌ **Checagem de compilação e sintaxe inválida** (lint, typecheck ou build)" ;;
          esac

          case "$FROM_DEV" in
            success) line "✅ Origem \`dev\` com pré-release" ;;
            failure) line "❌ PR para \`prod\` precisa vir da \`dev\` com pré-release" ;;
          esac

          case "$TESTE" in
            success) line "🚀 Deploy no ambiente de **Teste** sucedido: $URL" ;;
            failure) line "❌ **Erro ao implantar no ambiente de Teste**" ;;
            skipped) if [ "$GITHUB_BASE_REF" = dev ]; then line "⏭️ Deploy no ambiente de **Teste** não executado: corrija a checagem"; fi ;;
          esac

          body+=$'\n'"Commit \`${SHA:0:7}\` · [Ver execução]($RUN_URL)"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$body"